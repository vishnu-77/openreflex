name: Release

# Publishing uses PyPI Trusted Publishing (OIDC): no API tokens are stored anywhere.
#   TestPyPI: Actions -> Release -> Run workflow (target: testpypi), then the verify job installs it on 3 OSes.
#   PyPI:     run with target: pypi, or publish a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        run: python -c "import tomllib; print('version=' + tomllib.load(open('pyproject.toml','rb'))['project']['version'])" >> "$GITHUB_OUTPUT"
      - run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/openreflex
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    needs: [build, testpypi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from TestPyPI (dependencies from PyPI) and smoke-test
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then PY="$RUNNER_TEMP/venv/Scripts/python"; else PY="$RUNNER_TEMP/venv/bin/python"; fi
          for attempt in 1 2 3 4 5 6; do
            "$PY" -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ \
              "openreflex==$VERSION" && break
            echo "index not updated yet; retrying"; sleep 30
          done
          cp scripts/smoke_installed.py "$RUNNER_TEMP/smoke.py"
          cd "$RUNNER_TEMP" && "$PY" smoke.py

  pypi:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openreflex
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A GitHub Release for a version that is already on PyPI is a no-op instead of a failed run.
          skip-existing: true

  mcp-registry:
    # Lists the server in the official MCP Registry. The registry verifies the PyPI package through the
    # mcp-name marker in the README, so this runs after the PyPI upload.
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json matches the released version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(jq -r .version server.json)" = "$VERSION"
          test "$(jq -r '.packages[0].version' server.json)" = "$VERSION"
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "PyPI may not show the new release yet; retrying"; sleep 30
          done
          exit 1
