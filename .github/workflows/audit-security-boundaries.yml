name: Security boundary audit probes
on:
  pull_request:
    paths:
      - "scripts/audit_security_boundaries.py"
      - ".github/workflows/audit-security-boundaries.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenReflex for isolated tests
        run: python -m pip install -e ".[dev]"
      - name: Reproduce verification/retraction semantics
        run: python scripts/audit_security_boundaries.py
      - name: Run SecChecker static scan against OpenReflex
        shell: bash
        run: |
          python -m pip install "git+https://github.com/vishnu-77/secchecker.git@71b9e3c704aa78d9cf425a4c6c2832d7d5ff523a"
          rc=0
          secchecker . --type all --format json --output audit-openreflex-raw.json --severity-threshold LOW || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::SecChecker encountered a runtime error ($rc)"
            exit "$rc"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("audit-openreflex-raw.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          sanitized = {
              "tool": "secchecker",
              "source_revision": "71b9e3c704aa78d9cf425a4c6c2832d7d5ff523a",
              "summary": data.get("summary"),
              "finding_categories_by_file": {
                  path: list(items.keys())
                  for path, items in data.get("findings", {}).items()
              },
              "limitations": "Static matches require human triage; raw matches not retained in artifact",
          }
          Path("audit-secchecker-summary.json").write_text(
              json.dumps(sanitized, indent=2, sort_keys=True), encoding="utf-8"
          )
          p.unlink()
          print(json.dumps(sanitized, indent=2, sort_keys=True))
          PY
      - name: Probe SecChecker AST and LLM analysis boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from secchecker.ast_scanner import scan_file_ast
          from secchecker.llm_scanner import scan_file_llm

          with TemporaryDirectory(prefix="secchecker-logic-audit-") as temp:
              source = Path(temp) / "case.py"

              source.write_text(
                  "def first():\n"
                  "    value = input()\n"
                  "def second():\n"
                  "    value = 'literal'\n"
                  "    os.system(value)\n",
                  encoding="utf-8",
              )
              wrong_cross_function_taint = (
                  "AST - Tainted Input to Dangerous Sink" in scan_file_ast(str(source))
              )

              source.write_text(
                  "def main():\n"
                  "    first = input()\n"
                  "    alias = first\n"
                  "    os.system(alias)\n",
                  encoding="utf-8",
              )
              missing_alias_propagation = (
                  "AST - Tainted Input to Dangerous Sink" not in scan_file_ast(str(source))
              )

              source.write_text(
                  "prompt = secret\n"
                  "def ordinary():\n"
                  "    return prompt\n"
                  "def unrelated():\n"
                  "    return client.chat.completions.create(model='x', messages=[])\n",
                  encoding="utf-8",
              )
              unrelated_llm_sink_satisfies_file_guard = (
                  "LLM - Secret Passed to LLM" in scan_file_llm(str(source))
              )

          report = {
              "scope": "isolated deterministic parser/scanner behaviour, not exploitability",
              "ast_cross_function_false_positive": wrong_cross_function_taint,
              "ast_missing_alias_taint_propagation": missing_alias_propagation,
              "llm_file_wide_sink_guard_false_positive": unrelated_llm_sink_satisfies_file_guard,
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          Path("audit-secchecker-logic.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          PY
      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-security-boundaries
          path: |
            audit-security-probe-results.json
            audit-secchecker-summary.json
            audit-secchecker-logic.json
          if-no-files-found: warn
