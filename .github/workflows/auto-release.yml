name: Auto Release

# A successful CI run on main is the only automatic release trigger.
# This workflow validates the CI-tested version and dispatches release.yml with that exact SHA.
# Publishing happens in release.yml so PyPI Trusted Publishing sees the expected workflow identity.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: openreflex-auto-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the exact CI-tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: version
        name: Validate release metadata
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import tomllib
          from pathlib import Path

          root = Path(".")
          version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          runtime = {}
          exec((root / "src/openreflex/__init__.py").read_text(), runtime)
          manifests = [
              root / "plugins/openreflex/.claude-plugin/plugin.json",
              root / "plugins/openreflex/.codex-plugin/plugin.json",
              root / "plugins/openreflex/.cursor-plugin/plugin.json",
          ]
          server = json.loads((root / "server.json").read_text())
          changelog = (root / "CHANGELOG.md").read_text()

          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?", version), version
          assert runtime["__version__"] == version
          assert all(json.loads(path.read_text())["version"] == version for path in manifests)
          assert server["version"] == version
          assert server["packages"][0]["version"] == version
          assert f"## {version} " in changelog or f"## {version}\n" in changelog

          print(f"version={version}")
          print(f"tag=v{version}")
          PY

      - id: release
        name: Check whether this version already has a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; no publication required."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  dispatch:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the trusted release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f target=pypi \
            -f create_github_release=true \
            -f release_ref="$RELEASE_SHA"
